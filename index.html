<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visualizador PRO + Detector de Voz</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{ margin-top:20px; }

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#1abc9c;
    color:white;
}

button:hover{ background:#16a085; }

canvas{
    margin-top:25px;
    border:2px solid #555;
    background:black;
}

#nivel{
    margin-top:15px;
    font-size:20px;
}

#voz{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>PROYECTO PARA VERSIONADO ET 26 DE 6</h1>


<h1>Osciloscopio + FFT + Detector de Voz</h1>

<button onclick="iniciar()">Activar Micrófono</button>

<br>

<canvas id="canvas" width="1000" height="300"></canvas>

<div id="nivel">Nivel: 0 %</div>
<div id="voz">Estado: ---</div>

<script>

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

async function iniciar(){

const stream=await navigator.mediaDevices.getUserMedia({audio:true});

const audioContext=new AudioContext();
const source=audioContext.createMediaStreamSource(stream);
const analyser=audioContext.createAnalyser();

analyser.fftSize=2048;

source.connect(analyser);

// datos
const bufferLength=analyser.fftSize;
const dataArray=new Uint8Array(bufferLength);
const freqData=new Uint8Array(analyser.frequencyBinCount);

function dibujar(){

requestAnimationFrame(dibujar);

// =====================
// OSCILOSCOPIO
// =====================

analyser.getByteTimeDomainData(dataArray);

ctx.fillStyle="rgba(0,0,0,0.3)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="rgba(0,255,0,0.3)";
ctx.beginPath();
ctx.moveTo(0,canvas.height/2);
ctx.lineTo(canvas.width,canvas.height/2);
ctx.stroke();

ctx.lineWidth=2;
ctx.strokeStyle="#00ff88";

ctx.beginPath();

let sliceWidth=canvas.width/bufferLength;
let x=0;

let suma=0;

for(let i=0;i<bufferLength;i++){

let v=(dataArray[i]-128)/128.0;
let y=canvas.height/2 + v*(canvas.height/2);

suma+=v*v;

if(i===0){ ctx.moveTo(x,y); }
else{ ctx.lineTo(x,y); }

x+=sliceWidth;

}

ctx.stroke();

// =====================
// FFT (ECUALIZADOR)
// =====================

analyser.getByteFrequencyData(freqData);

let bars=60;
let step=Math.floor(freqData.length/bars);
let barWidth=canvas.width/bars;

for(let i=0;i<bars;i++){

let value=freqData[i*step];
let percent=value/255;

let barHeight=percent*canvas.height*0.5;

let x=i*barWidth;
let y=canvas.height-barHeight;

let r=percent*255;
let g=255-(percent*150);

ctx.fillStyle=`rgb(${r},${g},50)`;

ctx.fillRect(x,y,barWidth-2,barHeight);

}

// =====================
// NIVEL RMS
// =====================

let rms=Math.sqrt(suma/bufferLength);
let porcentaje=Math.min(100,rms*200);

document.getElementById("nivel").innerHTML=
"Nivel: "+porcentaje.toFixed(1)+" %";

// =====================
// 🎤 DETECTOR DE VOZ
// =====================

// rango típico voz (bins medios)
let inicio=Math.floor(freqData.length*0.05);
let fin=Math.floor(freqData.length*0.25);

let energiaVoz=0;

for(let i=inicio;i<fin;i++){
    energiaVoz+=freqData[i];
}

energiaVoz/= (fin-inicio);

// umbrales simples
let hayVoz = (rms > 0.02 && energiaVoz > 30);

let estado = document.getElementById("voz");

if(hayVoz){
    estado.innerHTML="🟢 Voz detectada";
    estado.style.color="#00ff88";
}else{
    estado.innerHTML="⚪ Ruido / silencio";
    estado.style.color="#aaaaaa";
}

}

dibujar();

}

</script>

</body>
</html>
